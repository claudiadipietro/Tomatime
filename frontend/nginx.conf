server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location = /api {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
