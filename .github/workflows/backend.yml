name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
    inputs:
      api_commit:
        description: 'Optional full commit SHA to build and deploy'
        required: false
        type: string
      verify_azure:
        description: 'Only verify Azure login and API access; do not deploy'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_azure
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tomatime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tomatime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Validate selected commit
        env:
          API_COMMIT: ${{ inputs.api_commit }}
        run: |
          if [[ -n "$API_COMMIT" && ! "$API_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "api_commit must be a full 40-character commit SHA."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.api_commit || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test backend
        env:
          TOMATIME_PUSH_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=tomatime_test;Username=postgres;Password=ci-only-password'
        run: dotnet test backend/tests/Tomatime.Api.Tests/Tomatime.Api.Tests.csproj --configuration Release

      - name: Publish API
        run: |
          dotnet publish backend/src/Tomatime.Api/Tomatime.Api.csproj --configuration Release --output publish
          rm -f publish/appsettings.json publish/appsettings.Development.json

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/
          if-no-files-found: error

  verify-azure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_azure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify access to the API
        run: az webapp show --resource-group tomatime-rg --name tomatime-api --query state --output tsv

  deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && !inputs.verify_azure
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: tomatime-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: tomatime-api
          slot-name: Production
          package: publish/
